---
# code: language=ansible
#
# Final playbook before host preparation is considered done.
# Run after the PNR checklist is completed.
#
#   ansible-playbook playbooks/04-finish-pnr.yml -i <inventory> -e srv=vse

- hosts: "{{ srv }}"
  gather_facts: true
  become: true
  vars_files:
    - ../secrets/vault.yml
  roles:
    - role: preflight
      tags: [preflight]
    - role: production-users
      tags: [users]
    - role: ipmi-sdsadmin
      tags: [ipmi]
    - role: relocate-s3-init
      tags: [s3]
