---
# code: language=ansible
#
# Run after the UNIX group's init playbook (outside this repo).
# Reinstalls /etc/hosts from <inventory_dir>/group_vars/etc-hosts (same
# source as playbook 01; often updated between 01 and this run).
# Also writes /etc/ceph/cmdb.ini (CLUSTER_NAME + HOST_REAL_SIZE).
#
#   ansible-playbook playbooks/05-post-init.yml -i <inventory> -e srv=deployment

- hosts: "{{ srv }}"
  gather_facts: true
  become: true
  vars_files:
    - ../secrets/vault.yml
  roles:
    - role: preflight
      tags: [preflight]
    - role: etc-hosts
      tags: [network, hosts]
    - role: cmdb-ini
      tags: [ceph, cmdb]
    - role: reconcile-users
      tags: [users]
    - role: ntp
      tags: [network, ntp]
    - role: ceph-cluster-info
      tags: [ceph]
    - role: ca-certs
      tags: [certs, tls]
    - role: sssd-ldaps
      tags: [sssd, ldap, tls]
    - role: zabbix-agent
      tags: [zabbix]
    - role: shell-prompt
      tags: [prompt]
