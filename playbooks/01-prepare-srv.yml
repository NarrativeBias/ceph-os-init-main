---
# code: language=ansible
#
# OS-level host preparation (network, packages, tuning, users). No Ceph
# cluster setup and no cluster_action — that is playbook 02-prepare-ceph.
#
#   ansible-playbook playbooks/01-prepare-srv.yml -i <inventory> -e srv=vse
#   ansible-playbook playbooks/01-prepare-srv.yml -i <inventory> -e srv=new
#
# /etc/hosts is installed from <inventory_dir>/etc-hosts, next to group_vars.
# Copy etc-hosts.example there and fill in IP FQDN shortname. Playbook 03
# installs the same file again.
#
# Copy group_vars/all.yml.sample to group_vars/all.yml and fill it in.

- name: Prepare OS on target hosts
  hosts: "{{ srv }}"
  gather_facts: true
  become: true
  vars_files:
    - ../secrets/vault.yml
  roles:
    - role: preflight
      tags: [preflight]
    - role: bootstrap-dns
      tags: [network, dns]
    - role: set-hostname
      tags: [network, hostname]
    - role: etc-hosts
      tags: [network, hosts]
    - role: apt-repos
      tags: [packages, repos]
    - role: base-packages
      tags: [packages]
    - role: dnsmasq
      tags: [network, dns]
    - role: ntp
      tags: [network, ntp]
    - role: os-tune
      tags: [os]
    - role: raid-cli
      tags: [storage, raidcli]
    - role: extend-root-pv
      tags: [storage]
    - role: unix-users
      tags: [users]
