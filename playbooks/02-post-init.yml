---
# code: language=ansible
#
# Reinstalls /etc/hosts from <inventory_dir>/etc-hosts after the file has been
# replaced between playbook 01 and this one. Same source as playbook 01.

- hosts: "{{ srv }}"
  gather_facts: true
  become: true
  vars_files:
    - ../secrets/vault.yml
  roles:
    - role: preflight
      tags: [preflight]
    - role: etc-hosts
      tags: [network, hosts]
    - role: reconcile-users
      tags: [users]
    - role: ntp
      tags: [network, ntp]
    - role: ceph-cluster-info
      tags: [ceph]
    - role: refresh-ceph-repo
      tags: [packages, repos, ceph]
    - role: sssd-ldaps
      tags: [sssd, ldap, tls]
