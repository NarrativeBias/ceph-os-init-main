---
# code: language=ansible
#
# Enable SSSD LDAPS (ad_use_ldaps) + install domain CA certs on already-deployed hosts.
# Does not run the rest of 02-post-init (users, ntp, ceph-cluster-info, etc.).
#
# Prerequisites:
#   - seg_fqdn set in inventory group_vars
#   - certs in THIS repo: secrets/certs/<domain>/*.crt (shared; not per-inventory)
#     Prefer plaintext PEM (CA certs are public). If vault-encrypted, pass
#     --ask-vault-pass with the same password used to encrypt those files.
#   - hosts already domain-joined with /etc/sssd/sssd.conf
#
# Usage:
#   ansible-playbook playbooks/existing-servers/enable-sssd-tls.yml -i <inventory> -e srv=<group>
#   ansible-playbook ... --ask-vault-pass   # only if certs are vault-encrypted

- hosts: "{{ srv }}"
  gather_facts: true
  become: true
  pre_tasks:
    - name: require seg_fqdn
      ansible.builtin.assert:
        that:
          - seg_fqdn is defined
          - seg_fqdn | length > 0
        fail_msg: "seg_fqdn must be set in group_vars for this inventory group."
  roles:
    - role: sssd-ldaps
      tags: [sssd, ldap, tls]
