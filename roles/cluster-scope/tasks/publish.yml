---
- name: publish cluster host lists
  ansible.builtin.set_fact:
    cluster_new_hosts: "{{ groups[srv] | sort }}"
    cluster_existing_hosts: "{{ ([] if cluster_action == 'init' else (groups[cluster_members_group] | difference(groups[srv]))) | sort }}"
    cluster_hosts: "{{ (([] if cluster_action == 'init' else (groups[cluster_members_group] | difference(groups[srv]))) | sort) + (groups[srv] | sort) }}"
