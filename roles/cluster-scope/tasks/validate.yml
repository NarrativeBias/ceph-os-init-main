---
- name: require cluster_action
  ansible.builtin.assert:
    that:
      - cluster_action is defined
      - cluster_action in cluster_actions
    fail_msg: >-
      cluster_action must be one of {{ cluster_actions | join(', ') }}
      (got '{{ cluster_action | default('undefined') }}').
      Pass -e cluster_action=init|extend, or set it in inventory group_vars.
  run_once: true

- name: require srv to be the work group
  ansible.builtin.assert:
    that:
      - srv is defined
      - srv | length > 0
      - srv == cluster_work_group
      - srv in groups
      - groups[srv] | length > 0
    fail_msg: >-
      Pass -e srv={{ cluster_work_group }}: group '{{ cluster_work_group }}' lists
      only the hosts this run prepares (got '{{ srv | default('undefined') }}').
  run_once: true

- name: require vse to list the cluster
  ansible.builtin.assert:
    that:
      - cluster_members_group in groups
      - groups[cluster_members_group] | length > 0
    fail_msg: >-
      Inventory group '{{ cluster_members_group }}' must list every server in the cluster.
  run_once: true

- name: init works on the whole cluster via deployment
  ansible.builtin.assert:
    that:
      - (groups[cluster_work_group] | sort) == (groups[cluster_members_group] | sort)
    fail_msg: >-
      cluster_action=init: '{{ cluster_work_group }}' must list the same hosts as
      '{{ cluster_members_group }}' (the whole cluster).
      deployment={{ groups[cluster_work_group] | sort | join(', ') }};
      {{ cluster_members_group }}={{ groups[cluster_members_group] | sort | join(', ') }}.
  when: cluster_action == 'init'
  run_once: true

- name: extend prepares only new hosts in deployment
  ansible.builtin.assert:
    that:
      - (groups[cluster_work_group] | difference(groups[cluster_members_group])) | length == 0
      - (groups[cluster_members_group] | difference(groups[cluster_work_group])) | length > 0
    fail_msg: >-
      cluster_action=extend: '{{ cluster_work_group }}' must list only hosts being added
      (and they must also be in '{{ cluster_members_group }}').
      '{{ cluster_members_group }}' must still list hosts already in the cluster
      (not only the new ones). This playbook does not connect to those existing hosts.
  when: cluster_action == 'extend'
  run_once: true
