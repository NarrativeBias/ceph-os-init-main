---
- name: configure chrony.conf
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chrony

- name: enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
