---
# AD domains that may appear in seg_fqdn / [domain/...] in sssd.conf.
# Longer / more specific names first (first match wins).
sssd_ad_domains:
  - vtbgroup.vtb.com
  - corp.dev.vtb
  - region.vtb.ru
  - test.vtb.ru
  - cn-test.vtb
  - cn-prod.vtb
  - cn-inet.vtb
  - inet.vtb
  - cde.vtb

sssd_conf_path: /etc/sssd/sssd.conf
# LDAPS on 636 via DNS SRV for the domain. Do not set ldap_uri: that pins
# servers and stops SSSD from refreshing the DC list and failing over.
sssd_ad_use_ldaps: true
