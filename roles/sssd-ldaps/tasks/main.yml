---
- name: resolve AD domain from seg_fqdn
  ansible.builtin.set_fact:
    sssd_ad_domain: "{{ item }}"
  loop: "{{ sssd_ad_domains }}"
  when:
    - sssd_ad_domain is not defined
    - item == seg_fqdn or seg_fqdn.endswith('.' + item)

- name: require a known AD domain for seg_fqdn
  ansible.builtin.assert:
    that:
      - sssd_ad_domain is defined
      - sssd_ad_domain | length > 0
    fail_msg: >-
      seg_fqdn '{{ seg_fqdn }}' does not match any configured SSSD AD domain
      ({{ sssd_ad_domains | join(', ') }}).

- name: ensure sssd is installed
  ansible.builtin.apt:
    name: sssd
    state: present

- name: ensure sssd.conf exists
  ansible.builtin.stat:
    path: "{{ sssd_conf_path }}"
  register: sssd_conf_stat

- name: require existing sssd.conf
  ansible.builtin.assert:
    that:
      - sssd_conf_stat.stat.exists
    fail_msg: "{{ sssd_conf_path }} is missing; join AD / create sssd.conf before enabling TLS."

- name: read sssd.conf
  ansible.builtin.slurp:
    src: "{{ sssd_conf_path }}"
  register: sssd_conf_raw

- name: require domain section in sssd.conf
  ansible.builtin.assert:
    that:
      - ("[domain/" ~ sssd_ad_domain ~ "]") in (sssd_conf_raw.content | b64decode)
    fail_msg: >-
      Section [domain/{{ sssd_ad_domain }}] not found in {{ sssd_conf_path }}.

- name: enable ad_use_ldaps in domain section
  ansible.builtin.lineinfile:
    path: "{{ sssd_conf_path }}"
    regexp: '^ad_use_ldaps\s*='
    line: "ad_use_ldaps = {{ sssd_ad_use_ldaps | bool | ternary('True', 'False') }}"
    insertafter: "^\\[domain/{{ sssd_ad_domain }}\\]"
  notify: restart sssd

- name: ensure sssd.conf permissions
  ansible.builtin.file:
    path: "{{ sssd_conf_path }}"
    owner: root
    group: root
    mode: "0600"
