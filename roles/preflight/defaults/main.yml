---
supported_environment_types:
  - DEV
  - TEST
  - PROD

# Local admin created by roles/production-users in playbook 06.
production_admin_users:
  PROD: psadm
  TEST: tsadm
  DEV: dsadm

# Set ubuntu_version in group_vars (e.g. "24.04"); codename is derived.
ubuntu_version_codenames:
  "20.04": focal
  "24.04": noble

# Allowed ceph_version prefixes per OS (blocks old Ceph on new OS and vice versa).
# In use: 17.2.6 / 18.2.7 → 20.04; 19.2.6 / 20.2.4 → 24.04.
ubuntu_ceph_compat:
  "20.04":
    - "17."
    - "18."
  "24.04":
    - "19."
    - "20."

# Always required (group_vars / vault)
preflight_required_vars:
  - local_registry
  - ceph_version
  - ubuntu_version
  - environment_type
  - dns_ip
  - seg_fqdn
  - ntp_ip
  - m_repo
  - aroot_postinit
  - sdsadmin_passwd
  - cluster_network
  - public_networks

# Extra vault vars per environment_type
preflight_env_required_vars:
  PROD:
    - aroot_hash
    - psadm_pubkey
  TEST:
    - troot_hash
    - tsadm_pubkey
  DEV:
    - dsadm_pubkey
