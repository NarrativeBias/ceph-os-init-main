---
# Version-specific dnsmasq setup (20.04 vs 24.04 differ in order / resolvconf).

- name: configure dnsmasq for Ubuntu 20.04
  ansible.builtin.import_tasks: ubuntu-20.04.yml
  when: ubuntu_version | string == '20.04'
  tags: [ubuntu-20.04, dnsmasq, network]

- name: configure dnsmasq for Ubuntu 24.04
  ansible.builtin.import_tasks: ubuntu-24.04.yml
  when: ubuntu_version | string == '24.04'
  tags: [ubuntu-24.04, dnsmasq, network]
