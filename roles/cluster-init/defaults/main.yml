---
mon_ansible_dir: /etc/ansible
mon_ansible_inventory: "{{ mon_ansible_dir }}/hosts"
mon_ansible_cfg: "{{ mon_ansible_dir }}/ansible.cfg"
mon_ansible_packages:
  - ansible
  - sshpass

# *.tar.gz archives on the controller (roles/cluster-init/files/), loaded on the first mon.
registry_images_dir: "{{ role_path }}/files"
registry_images_stage: /var/lib/containers/registry-images
