---
# Local registry on the first mon. Image archives live in registry_images_dir
# on the controller (default: <inventory_dir>/registry-images) and are staged
# on the mon under /var/lib/containers/registry-images.
#
# Push and pull use the insecure setting written by the podman role in
# /etc/containers/registries.conf.d/ceph.conf. This file is imported from
# cluster-init, which playbook 01 runs after that role.

- name: require local_registry
  ansible.builtin.assert:
    that:
      - local_registry is defined
      - local_registry is match('^[^:]+:[0-9]+$')
    fail_msg: >-
      local_registry must be host:port
      (got '{{ local_registry | default('undefined') }}').
  run_once: true

- name: find image archives on the controller
  ansible.builtin.find:
    paths: "{{ registry_images_dir }}"
    patterns: "*.tar.gz"
  delegate_to: localhost
  become: false
  run_once: true
  register: registry_archives

- name: image archive directory must contain tar.gz files
  ansible.builtin.assert:
    that:
      - registry_archives.files | default([]) | length > 0
    fail_msg: >-
      No *.tar.gz in {{ registry_images_dir }}.
      Put registry.tar.gz and the other image archives there
      (see registry-images/README).
  run_once: true

- name: deploy the local registry on the first mon
  when: inventory_hostname == groups['mons'][0]
  block:
    - name: install podman on the first mon
      ansible.builtin.apt:
        name: podman
        state: present
        update_cache: true

    - name: require the podman role insecure registry config
      ansible.builtin.stat:
        path: /etc/containers/registries.conf.d/ceph.conf
      register: ceph_registry_conf_stat

    - name: read the podman role insecure registry config
      ansible.builtin.slurp:
        src: /etc/containers/registries.conf.d/ceph.conf
      register: ceph_registry_conf
      when: ceph_registry_conf_stat.stat.exists

    - name: local registry must already be marked insecure
      ansible.builtin.assert:
        that:
          - ceph_registry_conf_stat.stat.exists
          - local_registry in ceph_registry_conf_text
          - ceph_registry_conf_text is search('insecure = true')
        fail_msg: >-
          {{ local_registry }} is not marked insecure in
          /etc/containers/registries.conf.d/ceph.conf.
          The podman role writes that file and has to run before registry setup,
          otherwise push and pull are refused.
      vars:
        ceph_registry_conf_text: "{{ ceph_registry_conf.content | b64decode if ceph_registry_conf.content is defined else '' }}"

    - name: create the image staging directory
      ansible.builtin.file:
        path: "{{ registry_images_stage }}"
        state: directory
        mode: "0755"

    - name: copy image archives to the first mon
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ registry_images_stage }}/"
        mode: "0644"
      loop: "{{ registry_archives.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: load image archives that are not already loaded
      ansible.builtin.shell: |
        set -euo pipefail
        tar="{{ registry_images_stage }}/{{ item.path | basename }}"
        stamp="${tar}.sha256"
        sum=$(sha256sum "$tar" | awk '{print $1}')
        if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$sum" ]; then
          echo "skip $tar"
          exit 0
        fi
        podman load -i "$tar"
        printf '%s\n' "$sum" > "$stamp"
      args:
        executable: /bin/bash
      loop: "{{ registry_archives.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: registry_loads
      changed_when: "'Loaded image' in stdout"

    - name: list loaded images
      ansible.builtin.command:
        argv:
          - podman
          - images
          - --format
          - "{{ '{{.Repository}}:{{.Tag}}' }}"
      register: loaded_images
      changed_when: false

    - name: choose the registry image and the images to publish
      ansible.builtin.set_fact:
        registry_container_image: "{{ loaded_images.stdout_lines | select('search', 'registry') | list | first | default('') }}"
        images_to_publish: "{{ loaded_images.stdout_lines | reject('search', 'registry') | reject('equalto', '<none>:<none>') | list }}"
        freshly_loaded_images: "{{ registry_loads.results | map(attribute='stdout') | map('split', '\n') | flatten | select('search', '^Loaded image') | map('regex_replace', '^Loaded image:\\s*', '') | list }}"

    - name: registry image must have been loaded
      ansible.builtin.assert:
        that:
          - registry_container_image | length > 0
        fail_msg: >-
          None of the loaded images is the registry.
          Add registry.tar.gz to {{ registry_images_dir }}.

    - name: check whether the registry service is active
      ansible.builtin.command: systemctl is-active container-registry.service
      register: registry_active
      changed_when: false
      failed_when: false

    - name: check whether the registry port is open
      ansible.builtin.shell: "timeout 3 bash -c 'echo > /dev/tcp/127.0.0.1/{{ local_registry.split(':') | last }}'"
      args:
        executable: /bin/bash
      register: registry_port
      changed_when: false
      failed_when: false

    - name: record whether the registry is already up
      ansible.builtin.set_fact:
        registry_already_up: "{{ registry_active.rc == 0 and registry_port.rc == 0 }}"

    - name: install the registry systemd unit
      ansible.builtin.template:
        src: container-registry.service.j2
        dest: /etc/systemd/system/container-registry.service
        mode: "0644"
      when: not registry_already_up

    - name: start the local registry
      ansible.builtin.systemd:
        name: container-registry.service
        daemon_reload: true
        enabled: true
        state: started
      when: not registry_already_up

    - name: wait for the local registry
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ local_registry.split(':') | last }}"
        delay: 2
        timeout: 60
      when: not registry_already_up

    - name: retag, push, drop both local tags, and pull back
      ansible.builtin.shell: |
        set -euo pipefail
        old="{{ item }}"
        fresh="{{ 'yes' if item in freshly_loaded_images else 'no' }}"
        case "$old" in
          */*) ;;
          *) echo "image has no registry prefix: $old" >&2; exit 1 ;;
        esac
        suffix="${old#*/}"
        new="{{ local_registry }}/${suffix}"
        if [ "$old" = "$new" ]; then
          echo "already local $old"
          exit 0
        fi
        if [ "$fresh" != "yes" ] && podman image exists "$new"; then
          podman image rm "$old" || true
          echo "already present $new"
          exit 0
        fi
        podman tag "$old" "$new"
        podman image rm "$old"
        podman push --tls-verify=false "$new"
        podman image rm "$new"
        podman pull --tls-verify=false "$new"
      args:
        executable: /bin/bash
      loop: "{{ images_to_publish }}"
      loop_control:
        label: "{{ item }}"
      changed_when: "'already ' not in stdout"
