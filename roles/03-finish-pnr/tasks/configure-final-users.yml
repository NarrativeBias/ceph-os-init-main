# PROD users
- name: create group psadm
  group:
    name: psadm
    state: present
    gid: 821
  when: environment_type == "PROD"
- name: create user
  user:
    name: psadm
    shell: /bin/bash
    uid: 821
    group: psadm
  when: environment_type == "PROD"
- name: psadm pubkey
  authorized_key:
    user: psadm
    state: present
    key: "{{psadm_pubkey}}"
  when: environment_type == "PROD"
- name: sudo for psadm
  copy:
    dest: /etc/sudoers.d/psadm
    owner: root
    group: root
    mode: 0440
    content: |
      psadm ALL = (ALL) NOPASSWD: ALL
  when: environment_type == "PROD"
- name: ensure psadm has no password expiration
  command: chage -M -1 psadm
  when: environment_type == "PROD"

