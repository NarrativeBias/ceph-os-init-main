- name: check if this deployment already has a cluster fsid
  become: true
  command: "ceph fsid"
  changed_when: false
  failed_when: false
  check_mode: false
  register: current_fsid
  run_once: true
  ignore_errors: false

- name: Generate ceph keys for vtbmon
  shell: |
    ceph auth get-or-create client.infra_duty \
    mon 'allow r' \
    mgr 'allow r, allow command "pg repair"' \
    | tee /tmp/.client.infra_duty
  delegate_to: localhost
  when:
    - not ansible_check_mode
    - current_fsid.rc == 0

- name: Distribute ceph keys
  copy:
    src: /tmp/.client.infra_duty
    dest: /tmp/.client.infra_duty
  when:
    - not ansible_check_mode
    - current_fsid.rc == 0

- name: check which vtbmon is used
  shell: 'getent passwd 181 | cut -d: -f1'
  register: vtbmon_username
  changed_when: false
  when:
   - current_fsid.rc == 0

- name: Change ceph keys ownership for vtbmon and move them
  copy:
    remote_src: true
    src: /tmp/.client.infra_duty
    dest: "/etc/ceph/client.infra_duty"
    owner: root
    group: root
    mode: '0644'
  when:
   - current_fsid.rc == 0

- name: Remove tmp ceph key
  file:
    path: /tmp/.client.infra_duty
    state: absent
  when:
   - current_fsid.rc == 0  
