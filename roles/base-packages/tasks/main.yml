---
- name: apt-get update
  ansible.builtin.apt:
    update_cache: true

- name: install pkgs for UNIX
  ansible.builtin.apt:
    name:
      - sysstat
      - dnsutils
      - chrony
      - wget
      - curl
      - net-tools
      - ifenslave
      - rsyslog
      - dnsmasq
      - ipmitool
      - nvme-cli
      - lldpd
      - jq
      - ethtool
    state: present

- name: remove unused packages
  ansible.builtin.apt:
    name:
      - snapd
      - cloud-init
      - aide
      - ufw
      - cloud-guest-utils
    state: absent
    purge: true
    autoremove: true

- name: apt-get upgrade
  ansible.builtin.apt:
    upgrade: true
