---
# Runs cephadm bootstrap on the first host in [mons] (inventory order). Init only.
# cephorch authorized_keys are installed later by playbook 03 (prepare-ceph-node).
# Never invoke bootstrap if an existing or partial cluster is detected — a failed
# cephadm bootstrap can delete cluster files under /var/lib/ceph.

- name: require mons group for bootstrap
  ansible.builtin.assert:
    that:
      - "'mons' in groups"
      - groups['mons'] | length > 0
      - groups['mons'][0] in ansible_play_hosts_all
    fail_msg: >-
      Inventory group 'mons' must list monitors, and its first host must be
      in this play (bootstrap runs there).
  run_once: true

- name: require cluster_network
  ansible.builtin.assert:
    that:
      - cluster_network is defined
      - cluster_network | length > 0
      - cluster_network is match('^.+/.+$')
    fail_msg: >-
      cluster_network must be set (CIDR), e.g. 10.0.0.0/27
      (got '{{ cluster_network | default('undefined') }}').
  run_once: true

- name: detect existing Ceph cluster
  ansible.builtin.import_role:
    name: ceph-cluster-detect
  when: ceph_cluster_already_present is not defined

- name: mark bootstrap needed on first mon
  ansible.builtin.set_fact:
    ceph_bootstrap_needed: true
  when:
    - inventory_hostname == groups['mons'][0]
    - not (ceph_bootstrap_skip_if_configured | bool)
      or not (ceph_cluster_already_present | bool)

- name: mark bootstrap not needed elsewhere
  ansible.builtin.set_fact:
    ceph_bootstrap_needed: false
  when: ceph_bootstrap_needed is not defined

- name: refuse forced bootstrap over an existing cluster
  ansible.builtin.assert:
    that:
      - not (ceph_cluster_already_present | default(false) | bool)
    fail_msg: >-
      Refusing cephadm bootstrap: cluster already present on
      {{ groups['mons'][0] }} (ceph.conf, admin keyring, and/or
      {{ ceph_bootstrap_lib_dir }}/<fsid>). Set
      ceph_bootstrap_skip_if_configured=true (default) to skip, or remove
      the existing cluster deliberately before re-bootstrapping.
  when:
    - inventory_hostname == groups['mons'][0]
    - ceph_bootstrap_needed | bool
    - not (ceph_bootstrap_skip_if_configured | bool)

- name: resolve mon IP from {{ ceph_bootstrap_mon_iface }}
  ansible.builtin.shell: |
    set -euo pipefail
    ip -o -4 addr show dev {{ ceph_bootstrap_mon_iface }} \
      | awk '{print $4}' | cut -d/ -f1 | head -1
  args:
    executable: /bin/bash
  register: ceph_bootstrap_mon_ip_cmd
  changed_when: false
  when: ceph_bootstrap_needed | bool

- name: require mon IP
  ansible.builtin.assert:
    that:
      - ceph_bootstrap_mon_ip_cmd.stdout | default('') | length > 0
    fail_msg: >-
      Could not resolve IPv4 address on {{ ceph_bootstrap_mon_iface }}
      for bootstrap --mon-ip.
  when: ceph_bootstrap_needed | bool

- name: stage ceph.conf.bootstrap on first mon
  ansible.builtin.copy:
    src: ceph.conf.bootstrap
    dest: "{{ ceph_bootstrap_config_remote }}"
    mode: "0644"
  when: ceph_bootstrap_needed | bool

- name: bootstrap Ceph cluster with cephadm
  ansible.builtin.command:
    argv:
      - cephadm
      - --image
      - "{{ ceph_bootstrap_image }}"
      - bootstrap
      - --skip-monitoring-stack
      - --skip-dashboard
      - --config
      - "{{ ceph_bootstrap_config_remote }}"
      - --allow-fqdn-hostname
      - --ssh-user
      - "{{ ceph_bootstrap_ssh_user }}"
      - --mon-ip
      - "{{ ceph_bootstrap_mon_ip_cmd.stdout | trim }}"
      - --cluster-network
      - "{{ cluster_network }}"
      - --log-to-file
  when: ceph_bootstrap_needed | bool

- name: remove staged ceph.conf.bootstrap
  ansible.builtin.file:
    path: "{{ ceph_bootstrap_config_remote }}"
    state: absent
  when: ceph_bootstrap_needed | bool
