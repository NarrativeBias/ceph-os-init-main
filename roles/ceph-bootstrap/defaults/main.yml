---
ceph_bootstrap_ssh_user: cephorch
# Interface used to derive --mon-ip for cephadm bootstrap.
ceph_bootstrap_mon_iface: bond0
ceph_bootstrap_config_remote: /var/tmp/ceph.conf.bootstrap
# Image for cephadm bootstrap (from registry; hosts pull in playbook 03).
ceph_bootstrap_image: "{{ local_registry }}/ubuntu/ceph:v{{ ceph_repo_ver }}"
# Skip bootstrap if /etc/ceph/ceph.conf already exists.
ceph_bootstrap_skip_if_configured: true
