- name: "validating Ubuntu release"
  assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_release == ubuntu_codename
    fail_msg: >-
      Unsupported OS '{{ ansible_distribution }} {{ ansible_distribution_release }}'.
      Required: Ubuntu {{ ubuntu_codename }} (24.04).

- name: "validating group_vars"
  assert:
    that:
    - vars[item] is defined
    - vars[item] is not none
    - vars[item] | length > 0
    fail_msg: "Required variable '{{ item }}' is not set. Check group_vars/all.yaml"
  loop:
   - local_registry
   - ceph_repo_ver
  run_once: true
