- name: apt-get update
  apt:
    update_cache: yes

- name: install pkgs for UNIX
  apt:
    pkg:
      - sysstat
      - dnsutils
      - chrony
      - wget
      - curl
      - python3-apt
      - python-apt-common
      - net-tools
      - ifenslave
      - rsyslog
      - dnsmasq
      - ipmitool
      - nvme-cli
      - lldpd
      - jq
      - ethtool

- name: apt-get upgrade
  apt:
    upgrade: yes
